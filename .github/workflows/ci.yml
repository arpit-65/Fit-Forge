# ─────────────────────────────────────────────────────────────────────────────
# CI Workflow — FitForge
#
# Runs on every push and pull request to "main".
# Steps: install → lint → typecheck → prisma validate → build → docker build
#
# No real secrets are used here. Fake values are passed so the Next.js build
# can compile without a live database.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node 20 (matches the Dockerfile) ────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm dependencies — speeds up future runs
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Lint (ESLint via Next.js) ──────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── 5. TypeScript type check ──────────────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 6. Validate the Prisma schema ─────────────────────────────────────
      # This catches any schema syntax errors or invalid relations.
      - name: Prisma validate
        run: npx prisma validate

      # ── 7. Generate Prisma client ─────────────────────────────────────────
      # Required before `next build` so that Prisma imports resolve.
      - name: Prisma generate
        run: npx prisma generate

      # ── 8. Next.js production build ───────────────────────────────────────
      # Uses fake env values — no real DB or API keys needed.
      - name: Next.js build
        env:
          DATABASE_URL:                  "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL:                    "postgresql://ci:ci@localhost:5432/ci"
          NEXT_PUBLIC_SUPABASE_URL:      "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY:     "ci-placeholder-service-key"
          NEXT_PUBLIC_APP_URL:           "http://localhost:3000"
          GEMINI_API_KEY:                "ci-placeholder-gemini-key"
          RISK_RECOMPUTE_SECRET:         "ci-secret"
          NEXT_TELEMETRY_DISABLED:       "1"
        run: npm run build

      # ── 9. Docker build (no push) ─────────────────────────────────────────
      # Verifies the Dockerfile itself is correct.
      # We do NOT push the image here — that only happens on version tags (CD).
      - name: Docker build (smoke test)
        run: |
          docker build \
            --target run \
            --tag fitforge:ci-test \
            .
