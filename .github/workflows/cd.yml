# ─────────────────────────────────────────────────────────────────────────────
# CD Workflow — FitForge (Docker image → GitHub Container Registry)
#
# Triggers ONLY when you push a version tag, e.g.: git tag v1.0.0 && git push --tags
#
# What it does:
#   1. Builds the Docker image
#   2. Pushes it to ghcr.io/<your-github-username>/fitforge:<tag>
#
# Note: Vercel deployment is handled automatically by Vercel's GitHub integration
# (see README.md). This workflow is for the Docker image only.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   GHCR_TOKEN  — a GitHub Personal Access Token with "write:packages" scope
# ─────────────────────────────────────────────────────────────────────────────

name: CD — Publish Docker Image

on:
  push:
    tags:
      - "v*"   # Matches v1.0.0, v2.3.1, etc.

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest

    # Required to push to ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to GitHub Container Registry ────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically available in Actions
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Extract metadata (version tag, etc.) ───────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag the image with the git version tag (e.g., v1.0.0)
            type=semver,pattern={{version}}
            # Also tag with just the major.minor (e.g., 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # And with "latest"
            type=raw,value=latest

      # ── 4. Set up Docker Buildx (needed for multi-platform builds) ────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Build and push the Docker image ────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: run
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds to speed up future pushes
          cache-from: type=gha
          cache-to: type=gha,mode=max
